<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 320px; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #0a0a16; color: #e2e8f0; margin: 0; }
        h1 { font-size: 16px; color: #22d3ee; margin: 0 0 4px; font-weight: 900; }
        .sub { font-size: 11px; color: rgba(199,210,254,0.5); margin-bottom: 16px; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(34,211,238,0.3); border-radius: 10px; padding: 14px; margin-bottom: 16px; text-align: center; }
        .num { font-size: 32px; font-weight: 900; color: #fff; }
        .lbl { font-size: 10px; color: rgba(199,210,254,0.4); text-transform: uppercase; letter-spacing: 1px; }
        button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 8px; color: #fff; }
        .pull { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .dl { background: linear-gradient(135deg, #10b981, #059669); }
        #msg { font-size: 12px; color: #fbbf24; margin: 10px 0; text-align: center; min-height: 18px; }
        .info { font-size: 11px; color: rgba(199,210,254,0.5); line-height: 1.7; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
        .info b { color: #22d3ee; }
    </style>
</head>
<body>
    <h1>NETWORK RECORDER <span style="font-size:10px;color:rgba(199,210,254,0.4);font-weight:400;">v1.0.4</span></h1>
    <div class="sub">Captures Amazon apply flow - no Start needed</div>
    
    <div class="box">
        <div class="num" id="num">0</div>
        <div class="lbl">requests captured</div>
    </div>
    
    <button class="pull" id="pullBtn" onclick="pullData()">Pull Data from This Tab</button>
    <button class="dl" id="dlBtn" onclick="downloadData()" style="display:none">Download JSON</button>
    <div id="msg">Interceptor runs automatically on Amazon pages.<br>Apply for a shift, then click Pull Data.</div>
    
    <div class="info">
        <b>Steps:</b><br>
        1. Navigate Amazon and apply for a shift<br>
        2. Click "Pull Data from This Tab"<br>
        3. Download the JSON and share it
    </div>
    
    <script>
        var _data = [];
        
        function pullData() {
            document.getElementById('msg').textContent = 'Pulling...';
            
            chrome.tabs.query({ active: true, currentWindow: true }, function(tabs) {
                if (!tabs || !tabs[0]) { 
                    document.getElementById('msg').textContent = 'No active tab found'; 
                    return; 
                }
                var tabId = tabs[0].id;
                
                // First inject reader.js to trigger data dump
                chrome.scripting.executeScript({
                    target: { tabId: tabId },
                    files: ['reader.js']
                }, function() {
                    if (chrome.runtime.lastError) {
                        document.getElementById('msg').textContent = 'Error: ' + chrome.runtime.lastError.message;
                        return;
                    }
                    
                    // Wait for reader.js to dump data into title
                    setTimeout(function() {
                        chrome.tabs.get(tabId, function(tab) {
                            if (tab.title && tab.title.startsWith('__RECORDER__')) {
                                var json = tab.title.substring('__RECORDER__'.length);
                                try {
                                    _data = JSON.parse(json);
                                    document.getElementById('num').textContent = _data.length;
                                    document.getElementById('dlBtn').style.display = 'block';
                                    document.getElementById('msg').textContent = 'Got ' + _data.length + ' requests! Click Download.';
                                } catch(e) {
                                    document.getElementById('msg').textContent = 'Parse error. Data may be too large for title.';
                                    // Fallback: try reading from DOM directly
                                    tryDomFallback(tabId);
                                }
                            } else {
                                // Title method failed — try DOM fallback
                                tryDomFallback(tabId);
                            }
                        });
                    }, 500);
                });
            });
        }
        
        function tryDomFallback(tabId) {
            chrome.scripting.executeScript({
                target: { tabId: tabId },
                func: function() {
                    var el = document.getElementById('__rec_count');
                    return el ? el.textContent : '0';
                }
            }, function(results) {
                if (chrome.runtime.lastError) {
                    document.getElementById('msg').textContent = 'Error: ' + chrome.runtime.lastError.message;
                    return;
                }
                var count = (results && results[0] && results[0].result) || '0';
                document.getElementById('num').textContent = count;
                if (parseInt(count) > 0) {
                    document.getElementById('msg').textContent = count + ' requests recorded. Data too large for popup transfer. Use DevTools console on the Amazon tab and run: copy(JSON.stringify(window.__recorderData))';
                } else {
                    document.getElementById('msg').textContent = 'No data captured yet. Make sure you are on an Amazon hiring page and have navigated around.';
                }
            });
        }
        
        function downloadData() {
            var json = JSON.stringify({
                meta: { recordedAt: new Date().toISOString(), total: _data.length },
                requests: _data
            }, null, 2);
            
            var blob = new Blob([json], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'amazon_apply_flow_' + Date.now() + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            document.getElementById('msg').textContent = 'Downloaded!';
        }
    </script>
</body>
</html>
