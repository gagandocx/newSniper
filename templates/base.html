<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ site_description }}{% endblock %}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}{{ site_name }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ site_description }}{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ site_url }}{% endblock %}">
    
    <!-- SEO -->
    <link rel="canonical" href="{% block canonical %}{{ site_url }}{% endblock %}">
    <meta name="robots" content="index, follow">
    
    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="{{ site_name }}" href="{{ site_url }}/feed.xml">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #ffffff;
            --bg-alt: #f9fafb;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --max-width: 1200px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
        }
        
        /* Header */
        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        
        nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: color 0.2s;
        }
        
        nav a:hover { color: var(--primary); }
        
        /* Main Content */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Article Cards */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .article-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            background: var(--bg);
        }
        
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .article-card .category {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }
        
        .article-card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .article-card h2 a {
            text-decoration: none;
            color: var(--text);
        }
        
        .article-card h2 a:hover { color: var(--primary); }
        
        .article-card .meta {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }
        
        .article-card .excerpt {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        
        /* Article Page */
        .article-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .article-content h1 {
            font-size: 2.25rem;
            line-height: 1.3;
            margin-bottom: 1rem;
        }
        
        .article-content .article-meta {
            color: var(--text-light);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .article-content h2 {
            font-size: 1.5rem;
            margin: 2rem 0 1rem;
            padding-top: 1rem;
        }
        
        .article-content h3 {
            font-size: 1.25rem;
            margin: 1.5rem 0 0.75rem;
        }
        
        .article-content p {
            margin-bottom: 1rem;
        }
        
        .article-content ul, .article-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
        
        .article-content li {
            margin-bottom: 0.5rem;
        }
        
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }
        
        .article-content th, .article-content td {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            text-align: left;
        }
        
        .article-content th {
            background: var(--bg-alt);
            font-weight: 600;
        }
        
        .article-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: var(--bg-alt);
            border-radius: 0 8px 8px 0;
        }
        
        .article-content a {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .article-content code {
            background: var(--bg-alt);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        /* Hero */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            border-radius: 16px;
            margin-bottom: 2rem;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }
        
        .hero p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Footer */
        footer {
            background: var(--bg-alt);
            border-top: 1px solid var(--border);
            padding: 2rem;
            margin-top: 4rem;
            text-align: center;
            color: var(--text-light);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .article-grid {
                grid-template-columns: 1fr;
            }
            
            .hero h1 { font-size: 1.75rem; }
            .article-content h1 { font-size: 1.75rem; }
            
            header { padding: 1rem; }
            main { padding: 1rem; }
            
            nav a { margin-left: 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">{{ site_name }}</a>
            <nav>
                <a href="/">Home</a>
                {% for cat in categories %}
                <a href="/category/{{ cat|lower|replace(' ', '-') }}.html">{{ cat }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; {{ year }} {{ site_name }}. All rights reserved.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            Affiliate Disclosure: Some links on this site are affiliate links. 
            We may earn a commission if you make a purchase through these links.
        </p>
    </footer>
</body>
</html>
